aid: ultra-safe-nuclear
name: Ultra Safe Nuclear
description: >-
  Ultra Safe Nuclear Corporation (USNC) was a Seattle-based advanced nuclear company, founded in
  2011, that vertically integrated fourth-generation nuclear power — the Micro Modular Reactor
  (MMR), the Pylon space reactor developed through its USNC-Tech subsidiary, and Fully Ceramic
  Microencapsulated (FCM) TRISO nuclear fuel manufactured at Oak Ridge, Tennessee. It filed for
  Chapter 11 bankruptcy in the District of Delaware in October 2024 following the death of its
  principal investor, and its assets were sold in a bifurcated Section 363 auction: NANO Nuclear
  Energy acquired the MMR and Pylon reactor patents and demonstration partnerships for $8.5
  million (court-approved 18 December 2024), and Standard Nuclear acquired the FCM/TRISO fuel
  business and the Oak Ridge facility for $28 million (closed February 2025). The company no
  longer operates. Its primary domain, usnc.com, is still registered and still routes mail on the
  Microsoft 365 US Government cloud but publishes no address record, so the corporate web presence
  is gone. As a reactor and nuclear-fuel manufacturer it never ran a developer program, and no
  public API, specification, SDK, or agent surface was found under its name.
